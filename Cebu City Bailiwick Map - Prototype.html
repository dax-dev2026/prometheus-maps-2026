<title>Cebu City Bailiwick Map — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220;--ink2:#0E1626;--panel:#121C2E;--panel2:#16223a;--line:#243450;--line2:#2f4364;
  --mist:#8DA2C0;--dim:#5b6f8d;--paper:#E8EEF6;--signal:#35C0D0;--sea:#0a1830;--sea2:#0d1f3b;
  --rama:#4C8DF6;--bopk:#E5484D;--swing:#E9C217;--none:#6B7A90;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#EEF2F8;--ink2:#E4EAF3;--panel:#FFFFFF;--panel2:#F3F6FB;--line:#D3DCE8;--line2:#B9C6D8;
    --mist:#4F6380;--dim:#7A8BA3;--paper:#0E1626;--signal:#0E8C9C;--sea:#DCE6F2;--sea2:#D2DEEC;--none:#9AA6B6;
  }
}
:root[data-theme="light"]{
  --ink:#EEF2F8;--ink2:#E4EAF3;--panel:#FFFFFF;--panel2:#F3F6FB;--line:#D3DCE8;--line2:#B9C6D8;
  --mist:#4F6380;--dim:#7A8BA3;--paper:#0E1626;--signal:#0E8C9C;--sea:#DCE6F2;--sea2:#D2DEEC;--none:#9AA6B6;
}
:root[data-theme="dark"]{
  --ink:#0B1220;--ink2:#0E1626;--panel:#121C2E;--panel2:#16223a;--line:#243450;--line2:#2f4364;
  --mist:#8DA2C0;--dim:#5b6f8d;--paper:#E8EEF6;--signal:#35C0D0;--sea:#0a1830;--sea2:#0d1f3b;--none:#6B7A90;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--ink2);flex-wrap:wrap}
.brand h1{font-family:var(--disp);font-weight:700;font-size:19px;margin:0;letter-spacing:.01em}
.brand p{margin:0;color:var(--mist);font-size:12px}
.sample{font-family:var(--mono);font-size:11px;color:var(--swing);border:1px dashed color-mix(in srgb,var(--swing) 60%,transparent);padding:3px 8px;border-radius:4px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--mist);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--paper);box-shadow:inset 0 -2px 0 var(--signal)}
.seg .lbl{font-family:var(--disp);font-weight:600}

main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);min-height:0}
.mapwrap{position:relative;min-height:0;background:radial-gradient(120% 90% at 70% 80%,var(--sea2),var(--sea));overflow:hidden;border-right:1px solid var(--line)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.drag{cursor:grabbing}
.bg path{stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .2s,filter .2s}
.bg path:hover{filter:brightness(1.18)}
.bg path.dim{fill-opacity:.12}
.sel{fill:none;stroke:var(--signal);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 6px var(--signal))}
.labels text{font-family:var(--disp);font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(8,14,26,.7);stroke-width:3px;text-anchor:middle;pointer-events:none;dominant-baseline:middle}
.grat line{stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke;opacity:.5}
.ctx text{font-family:var(--body);font-style:italic;fill:var(--dim);pointer-events:none}
.tools{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:34px;height:34px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);cursor:pointer;font-size:16px;line-height:1}
.tools button.wide{width:auto;padding:0 10px;font-size:12px}
.search{position:absolute;top:12px;right:12px;width:min(240px,50%)}
.search input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--paper);font:inherit}
.search ul{list-style:none;margin:4px 0 0;padding:0;background:var(--panel);border:1px solid var(--line2);border-radius:7px;max-height:220px;overflow:auto}
.search li button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;cursor:pointer}
.search li button:hover,.search li button:focus{background:var(--panel2)}
.legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;min-width:210px}
.legend h3{margin:0 0 6px;font-family:var(--disp);font-size:13px;font-weight:600}
.legend button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 2px;cursor:pointer;text-align:left;border-radius:4px}
.legend button[aria-pressed="false"]{opacity:.35}
.legend .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mist)}
.legend small{display:block;color:var(--dim);font-size:11px;margin-top:6px}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10;display:none;min-width:170px}
.tip b{font-family:var(--disp);font-size:14px;display:block}
.tip .m{color:var(--mist)}

aside{overflow:auto;min-height:0;background:var(--panel);padding:18px 20px 28px}
.crumb{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mist);margin-bottom:10px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--signal);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h2{font-family:var(--disp);font-size:24px;line-height:1.15;margin:0 0 4px;font-weight:700}
.sub{color:var(--mist);margin:0 0 16px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-weight:600;font-size:12.5px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 20px}
.stats div{background:var(--panel2);padding:10px 12px}
.stats b{display:block;font-family:var(--disp);font-size:20px;font-weight:600}
.stats span{font-size:11.5px;color:var(--mist)}
section{margin-bottom:22px}
section>h3{font-family:var(--disp);font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
section>h3 small{font-family:var(--body);font-weight:400;color:var(--dim);font-size:12px}
.bar{margin-bottom:10px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mist);margin-bottom:4px}
.bar .t b{color:var(--paper);font-weight:500}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:10.5px;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack i.lt{color:#1a1a1a}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{display:flex;align-items:center;gap:8px;padding:9px 2px;cursor:pointer;list-style:none;font-weight:500}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;color:var(--mist);font-family:var(--mono);font-size:12px}
summary::after{content:"+";color:var(--dim);width:14px;text-align:center}
details[open] summary::after{content:"–"}
.alist{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:0 2px 10px}
.alist button{background:none;border:0;text-align:left;padding:4px 6px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;font-size:13px}
.alist button:hover{background:var(--panel2)}
.alist small{color:var(--dim);font-family:var(--mono);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-weight:500;color:var(--mist);padding:6px 6px;border-bottom:1px solid var(--line2)}
td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.win{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.div{display:grid;grid-template-columns:40px 1fr;gap:4px 8px;align-items:center;font-size:11.5px;margin-top:10px}
.div .track{position:relative;height:12px;background:linear-gradient(90deg,transparent calc(50% - .5px),var(--line2) calc(50% - .5px),var(--line2) calc(50% + .5px),transparent calc(50% + .5px))}
.div .track i{position:absolute;top:1px;height:10px;border-radius:2px}
.div .ax{grid-column:2;display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{border-color:var(--signal)}
.pp{margin-bottom:12px}
.pp h4{margin:0 0 6px;font-size:12.5px;font-weight:500;color:var(--mist)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.tiles button{border:0;border-radius:5px;padding:7px 4px;font-family:var(--mono);font-size:11px;color:#fff;cursor:pointer;text-align:center}
.tiles button.lt{color:#1a1a1a}
.tiles button:hover{outline:2px solid var(--paper);outline-offset:-2px}
.note{font-size:12px;color:var(--dim);border-left:2px solid var(--line2);padding-left:10px;margin-top:16px}
.back{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;margin-bottom:14px}

@media (max-width:900px){
  .app{height:auto}
  main{grid-template-columns:1fr}
  .mapwrap{height:68vh;border-right:0;border-bottom:1px solid var(--line)}
  .seg{margin-left:0;overflow-x:auto;max-width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
  .legend{min-width:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const YEARS=[2013,2016,2019,2022,2025];
// Sample-only citywide swings (positive = toward Rama)
const SWING={2013:.18,2016:-.22,2019:.10,2022:.20,2025:-.12};
const OTHER={2013:.02,2016:.02,2019:.03,2022:.06,2025:.18};
const C={RAMA:'var(--rama)',BOPK:'var(--bopk)',SWING:'var(--swing)',NONE:'var(--none)',TIE:'var(--swing)'};
const HEX={RAMA:'#4C8DF6',BOPK:'#E5484D',SWING:'#E9C217',NONE:'#6B7A90',TIE:'#E9C217'};
const CLASSES=[['DH_RAMA','Die Hard Rama','RAMA','Rama camp won every cycle'],['DH_BOPK','Die Hard BOPK','BOPK','BOPK won every cycle'],['SWING','Swing','SWING','Winner changed between cycles'],['NONE','Insufficient history','NONE','Fewer than two cycles']];
const clsColor=c=>({DH_RAMA:HEX.RAMA,DH_BOPK:HEX.BOPK,SWING:HEX.SWING,NONE:HEX.NONE})[c];

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sig=x=>1/(1+Math.exp(-x));
const W=GEO.W,H=GEO.H;
const R0=rng(20250923);
const blobs=[...Array(7)].map(()=>({x:R0()*W,y:R0()*H,s:(R0()*2-1)*1.1,r:250+R0()*400}));
function lean(x,y){let v=.05;for(const b of blobs){const d=Math.hypot(x-b.x,y-b.y);v+=b.s*Math.exp(-(d*d)/(2*b.r*b.r))}return v}

(function(){const raw=GEO.b.map(b=>{const r=rng(b.id*7+3);return lean(b.cx,b.cy)+(r()*2-1)*.5});const m=raw.reduce((a,x)=>a+x,0)/raw.length;const sd=Math.sqrt(raw.reduce((a,x)=>a+(x-m)**2,0)/raw.length)||1;GEO.b.forEach((b,i)=>b._lean=(raw[i]-m)/sd*.42+.02)})();
const SCHOOL=['Elementary School','National High School','Barangay Hall','Integrated School','Covered Court','Day Care Center'];
const B=GEO.b.map((b,i)=>{
  const r=rng(b.id);
  const urban=b.area<1.5?1:b.area<5?.6:.25;
  const voters=Math.round(urban*(3500+r()*17000)+(1-urban)*(900+r()*2600));
  const nP=Math.max(2,Math.round(voters/(760+r()*140)));
  const L=b._lean;
  const nPlaces=Math.max(1,Math.min(5,Math.round(nP/10)));
  const places=[...Array(nPlaces)].map((_,k)=>`${b.name} ${SCHOOL[(k+Math.floor(r()*6))%SCHOOL.length]}`);
  const precincts=[];
  let left=voters;
  for(let k=0;k<nP;k++){
    const v=k===nP-1?left:Math.round(voters/nP*(.85+r()*.3));left-=v;
    const pl=(r()*2-1)*.45;
    const code='2217'+String(1000+i*70+k).slice(-4)+String.fromCharCode(65+(k%4));
    const cycles=YEARS.map(y=>{
      const rr=rng(b.id*31+k*7+y);
      const reg=Math.round(v*(0.86+.04*YEARS.indexOf(y)));
      const turn=.62+rr()*.2;
      const cast=Math.round(reg*turn);
      const oth=Math.round(cast*OTHER[y]*(.6+rr()*.8));
      const share=sig((L+pl+SWING[y]+(rr()*2-1)*.18)*2.4);
      const rama=Math.round((cast-oth)*share);
      return {year:y,rama,bopk:cast-oth-rama,other:oth,reg,cast};
    });
    precincts.push({code,place:places[k%nPlaces],cycles});
  }
  return {...b,idx:i,voters,precincts};
});
function summarize(cycles){
  return cycles.map(c=>{const t=c.rama+c.bopk;const w=t===0?null:c.rama>c.bopk?'RAMA':c.bopk>c.rama?'BOPK':'TIE';
    const all=c.rama+c.bopk+c.other;const ow=c.other>Math.max(c.rama,c.bopk)?'OTHER':w;
    return {...c,w,ow,margin:t?((c.rama-c.bopk)/t*100):0,turnout:c.reg?c.cast/c.reg*100:0,rp:all?c.rama/all*100:0,bp:all?c.bopk/all*100:0,op:all?c.other/all*100:0}});
}
function classify(s){const r=s.filter(c=>c.w);if(r.length<2)return'NONE';if(r.every(c=>c.w==='RAMA'))return'DH_RAMA';if(r.every(c=>c.w==='BOPK'))return'DH_BOPK';return'SWING'}
const flips=s=>{let f=0;const r=s.filter(c=>c.w);for(let i=1;i<r.length;i++)if(r[i].w!==r[i-1].w)f++;return f};
for(const b of B){
  for(const p of b.precincts){p.s=summarize(p.cycles);p.cls=classify(p.s);p.flips=flips(p.s);p.reg=p.cycles.at(-1).reg}
  const agg=YEARS.map((y,j)=>b.precincts.reduce((a,p)=>{const c=p.cycles[j];a.rama+=c.rama;a.bopk+=c.bopk;a.other+=c.other;a.reg+=c.reg;a.cast+=c.cast;return a},{year:y,rama:0,bopk:0,other:0,reg:0,cast:0}));
  b.s=summarize(agg);b.cls=classify(b.s);b.flips=flips(b.s);b.reg=b.s.at(-1).reg;
}

let view={x:-60,y:-40,w:W+120,h:H+80};
function fit(){const r=svg.getBoundingClientRect();const ar=r.width/r.height;let w=W+140,h=H+80;if(w/h<ar)w=h*ar;else h=w/ar;return{x:(W-w)/2,y:(H-h)/2,w,h}}
function setView(v){view=v;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);drawLabels()}
let anim=null;
function animateTo(t,ms=450){cancelAnimationFrame(anim);const f={...view},t0=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){setView(t);return}
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);setView({x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,w:f.w+(t.w-f.w)*e,h:f.h+(t.h-f.h)*e});if(k<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function zoomTo(bb,pad=1.8,minW=160){const r=svg.getBoundingClientRect(),ar=r.width/r.height;let w=Math.max(bb.width*pad,minW),h=Math.max(bb.height*pad,minW/ar);if(w/h<ar)w=h*ar;else h=w/ar;animateTo({x:bb.x+bb.width/2-w/2,y:bb.y+bb.height/2-h/2,w,h})}
function zoomBy(f,cx,cy){const v=view;cx??=v.x+v.w/2;cy??=v.y+v.h/2;const w=Math.min(Math.max(v.w*f,60),W*3),h=w*v.h/v.w;setView({x:cx-(cx-v.x)*w/v.w,y:cy-(cy-v.y)*h/v.h,w,h})}
function toSvg(e){const r=svg.getBoundingClientRect();return{x:view.x+(e.clientX-r.left)/r.width*view.w,y:view.y+(e.clientY-r.top)/r.height*view.h}}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);zoomBy(e.deltaY>0?1.15:1/1.15,p.x,p.y)},{passive:false});
let drag=null,moved=false;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,v:{...view}};moved=false});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)<4)return;moved=true;svg.classList.add('drag');const r=svg.getBoundingClientRect();setView({...drag.v,x:drag.v.x-dx/r.width*drag.v.w,y:drag.v.y-dy/r.height*drag.v.h})});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag')});
$('zin').onclick=()=>zoomBy(1/1.4);$('zout').onclick=()=>zoomBy(1.4);$('zreset').onclick=()=>animateTo(fit());
$('zdown').onclick=()=>{const names=['Pari-an','Kamagayan','Tinago','Ermita','Pasil','Sambag I','Capitol Site','Lahug','Mabolo','Mambaling'];const bs=B.filter(b=>names.includes(b.name)).map(b=>b.bb);const x0=Math.min(...bs.map(b=>b.x)),y0=Math.min(...bs.map(b=>b.y)),x1=Math.max(...bs.map(b=>b.x+b.width)),y1=Math.max(...bs.map(b=>b.y+b.height));zoomTo({x:x0,y:y0,width:x1-x0,height:y1-y0},1.15)};

function drawLabels(){const g=$('labels');if(!B[0].bb)return;const r=svg.getBoundingClientRect();const s=r.width/view.w;g.innerHTML='';$('ctx').querySelectorAll('text').forEach(t=>t.setAttribute('font-size',12/s));
  B.forEach(b=>{const wpx=b.bb.width*s,hpx=b.bb.height*s;const fs=Math.min(13,Math.max(9,wpx/9));if(wpx<b.name.length*fs*.62||hpx<fs*1.6)return;
    const t=document.createElementNS(NS,'text');t.textContent=b.name;t.setAttribute('x',b.cx);t.setAttribute('y',b.cy);t.setAttribute('font-size',fs/s);t.style.strokeWidth=(3/s)+'px';g.appendChild(t)})}

const tip=$('tip');
bg.addEventListener('pointermove',e=>{const i=e.target.dataset?.i;if(i==null){tip.style.display='none';return}const b=B[i];const c=mode==='PATTERN'?null:b.s.find(x=>x.year===mode);
  tip.innerHTML=`<b>${b.name}</b><span class="m">${b.district} District</span><br>${mode==='PATTERN'?`${labelOf(b.cls)} · ${b.flips} flip${b.flips===1?'':'s'}`:`${labelOf(unitKey(b))} · margin ${c.margin>0?'Rama +':'BOPK +'}${pct(Math.abs(c.margin))}`}<br><span class="m">${fmt(b.reg)} voters · ${b.precincts.length} precincts</span>`;
  tip.style.display='block';const x=e.clientX+14,y=e.clientY+14;tip.style.left=Math.min(x,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(y,innerHeight-tip.offsetHeight-8)+'px'});
bg.addEventListener('pointerleave',()=>tip.style.display='none');
bg.addEventListener('click',e=>{if(moved)return;const i=e.target.dataset?.i;if(i!=null)selectB(B[i],true)});
bg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset?.i!=null){e.preventDefault();selectB(B[e.target.dataset.i],true)}});

function paint(){B.forEach(b=>{b.el.setAttribute('fill',unitFill(b));b.el.style.fillOpacity=hidden.has(unitKey(b))?'':unitOpacity(b);b.el.classList.toggle('dim',hidden.has(unitKey(b)))});
  $('sel').setAttribute('d',selected?selected.d:'');renderLegend()}

// ---------- header modes ----------
function renderModes(){const m=$('modes');m.innerHTML='';[['PATTERN','Pattern'],...YEARS.map(y=>[y,String(y)])].forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;if(v==='PATTERN')b.className='lbl';b.setAttribute('aria-pressed',mode===v);b.onclick=()=>{mode=v;hidden.clear();chipFilter=null;renderModes();paint();renderPanel()};m.appendChild(b)})}

function renderLegend(){const L=$('legend');const counts={};B.forEach(b=>{const k=unitKey(b);counts[k]=(counts[k]||0)+1});
  L.innerHTML=`<h3>${mode==='PATTERN'?'Voting pattern, 2013–2025':`${mode} mayoral result`}</h3>`+keysForMode().filter(k=>mode==='PATTERN'||counts[k.k]).map(k=>`<button data-k="${k.k}" aria-pressed="${!hidden.has(k.k)}"><span class="sw" style="background:${k.color}"></span>${k.label}<span class="n">${counts[k.k]||0}</span></button>`).join('')+`<small>${mode==='PATTERN'?'Click a class to isolate it.':'Deeper shade = wider margin.'}</small>`;
  L.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const all=keysForMode().map(x=>x.k);
    if(hidden.size===0||hidden.has(k)&&hidden.size===all.length-1&&false){hidden=new Set(all.filter(x=>x!==k))}else if(!hidden.has(k)&&hidden.size===all.length-1){hidden.clear()}else{hidden.has(k)?hidden.delete(k):hidden.add(k)}paint()})}

// ---------- panel ----------
const P=$('panel');
function stackBar(title,items,unit){const tot=items.reduce((a,x)=>a+x.v,0)||1;return `<div class="bar"><div class="t"><span>${title}</span><b>${unit(tot)}</b></div><div class="stack">${items.map(x=>{const p=x.v/tot*100;return p>0?`<i style="width:${p}%;background:${x.c}" class="${x.c===HEX.SWING?'lt':''}" title="${x.l}: ${pct(p)}">${p>=7?Math.round(p)+'%':''}</i>`:''}).join('')}</div></div>`}
function splits(units,val){const ks=keysForMode();return ks.map(k=>({l:k.label,c:k.color,v:units.filter(u=>unitKey(u)===k.k).reduce((a,u)=>a+val(u),0)}))}
function divBars(s){const mx=Math.max(30,...s.map(c=>Math.abs(c.margin)));return `<div class="div">${s.map(c=>{const w=Math.abs(c.margin)/mx*50;return `<span>${c.year}</span><div class="track" title="${c.margin>0?'Rama':'BOPK'} +${pct(Math.abs(c.margin))}"><i style="${c.margin>=0?`left:50%;width:${w}%;background:${HEX.RAMA}`:`right:50%;width:${w}%;background:${HEX.BOPK}`}"></i></div>`}).join('')}<span></span><div class="ax"><span>← BOPK margin</span><span>Rama margin →</span></div></div>`}
function cycleTable(s){return `<table><thead><tr><th>Year</th><th>Rama</th><th>BOPK</th><th>Other</th><th>Margin</th><th>Turnout</th></tr></thead><tbody>${s.map(c=>`<tr><td><span class="win" style="background:${c.w?HEX[c.w]:HEX.NONE}"></span>${c.year}</td><td>${pct(c.rp)}</td><td>${pct(c.bp)}</td><td>${pct(c.op)}</td><td>${c.margin>0?'R +':'B +'}${pct(Math.abs(c.margin))}</td><td>${pct(c.turnout)}</td></tr>`).join('')}</tbody></table>`}
function badge(u){const k=unitKey(u);return `<span class="badge" style="background:${colorOf(k)};${k==='SWING'||k==='TIE'?'color:#1a1a1a':''}">${labelOf(k)}</span>`}
function crumb(){return `<nav class="crumb" aria-label="Breadcrumb"><button data-go="city">Cebu City</button>${selected?` › ${selPrecinct?`<button data-go="brgy">${selected.name}</button> › <span>${selPrecinct.code}</span>`:`<span>${selected.name}</span>`}`:''}</nav>`}

function renderPanel(){
  if(selPrecinct)return renderPrecinct();
  if(selected)return renderBrgy();
  const allP=B.flatMap(b=>b.precincts);
  const ks=keysForMode();
  const north=B.filter(b=>b.district==='North'),south=B.filter(b=>b.district==='South');
  const cnt=u=>1;
  P.innerHTML=crumb()+`<h2>Citywide</h2><p class="sub">${mode==='PATTERN'?'Consistency of the mayoral vote across five elections.':`Head-to-head winner in the ${mode} mayoral race.`}</p>
  <div class="stats"><div><b>80</b><span>barangays</span></div><div><b>${fmt(allP.length)}</b><span>precincts</span></div><div><b>${fmt(B.reduce((a,b)=>a+b.reg,0))}</b><span>voters (2025)</span></div><div><b>${Math.round(B.reduce((a,b)=>a+b.area,0))}</b><span>km² land area</span></div></div>
  <section><h3>Share by ${mode==='PATTERN'?'pattern':'winner'}</h3>
   ${stackBar('Barangays',splits(B,cnt),n=>fmt(n))}
   ${stackBar('Precincts',splits(allP,cnt),n=>fmt(n))}
   ${stackBar('Registered voters',splits(B,u=>u.reg),n=>fmt(n))}
   ${stackBar('Land area',splits(B,u=>u.area),n=>Math.round(n)+' km²')}
  </section>
  <section><h3>By district <small>barangays</small></h3>
   ${stackBar('North District',splits(north,cnt),n=>fmt(n))}
   ${stackBar('South District',splits(south,cnt),n=>fmt(n))}
  </section>
  <section><h3>Areas by ${mode==='PATTERN'?'pattern':'winner'} <small>sorted by voters</small></h3>
   ${ks.map(k=>{const list=B.filter(b=>unitKey(b)===k.k).sort((a,b)=>b.reg-a.reg);if(!list.length)return'';return `<details${k.k==='SWING'?' open':''}><summary><span class="sw" style="background:${k.color}"></span>${k.label}<span class="n">${list.length}</span></summary><div class="alist">${list.map(b=>`<button data-b="${b.idx}"><span>${b.name}</span><small>${fmt(b.reg)}</small></button>`).join('')}</div></details>`}).join('')}
  </section>
  <p class="note">Boundaries: PSGC 2023 barangay polygons. Votes, voters and precincts are generated sample data for testing the layout; replace with the pipeline output from the handoff. ${mode==='PATTERN'?'A barangay is Die Hard only if one camp won its combined precinct vote in every cycle.':''}</p>`;
  wirePanel();
}
function renderBrgy(){const b=selected;const ks=keysForMode();const byK={};b.precincts.forEach(p=>{const k=unitKey(p);byK[k]=(byK[k]||0)+1});
  const places=[...new Set(b.precincts.map(p=>p.place))];
  P.innerHTML=crumb()+`<button class="back" data-go="city">← Citywide</button><h2>${b.name}</h2><p class="sub">${b.district} District · ${badge(b)}</p>
  <div class="stats"><div><b>${fmt(b.reg)}</b><span>voters (2025)</span></div><div><b>${b.precincts.length}</b><span>precincts</span></div><div><b>${b.area<1?b.area.toFixed(2):b.area.toFixed(1)}</b><span>km²</span></div><div><b>${b.flips}</b><span>flips since 2013</span></div></div>
  <section><h3>Mayoral vote by cycle</h3>${cycleTable(b.s)}${divBars(b.s)}</section>
  <section><h3>Precincts <small>${mode==='PATTERN'?'by pattern':'by '+mode+' winner'}</small></h3>
   <div class="chips">${ks.filter(k=>byK[k.k]).map(k=>`<button data-chip="${k.k}" aria-pressed="${chipFilter===k.k}"><span class="sw" style="background:${k.color}"></span>${k.label} ${byK[k.k]}</button>`).join('')}</div>
   ${places.map(pl=>{const ps=b.precincts.filter(p=>p.place===pl&&(!chipFilter||unitKey(p)===chipFilter));if(!ps.length)return'';return `<div class="pp"><h4>${pl}</h4><div class="tiles">${ps.map(p=>{const k=unitKey(p);return `<button data-p="${p.code}" style="background:${unitFill(p)};opacity:${unitOpacity(p)}" class="${k==='SWING'||k==='TIE'?'lt':''}" title="${p.code} · ${labelOf(k)}">${p.code.slice(4)}</button>`}).join('')}</div></div>`}).join('')}
  </section>`;
  wirePanel();
}
function renderPrecinct(){const p=selPrecinct;
  P.innerHTML=crumb()+`<button class="back" data-go="brgy">← ${selected.name}</button><h2>Precinct ${p.code}</h2><p class="sub">${p.place} · ${badge(p)}</p>
  <div class="stats"><div><b>${fmt(p.reg)}</b><span>voters (2025)</span></div><div><b>${p.flips}</b><span>flips</span></div><div><b>${pct(p.s.at(-1).turnout)}</b><span>turnout 2025</span></div><div><b>${p.s.filter(c=>c.w).length}</b><span>cycles with results</span></div></div>
  <section><h3>Mayoral vote by cycle</h3>${cycleTable(p.s)}${divBars(p.s)}</section>
  <p class="note">In real data, clustered precinct codes often change between elections. A precinct is classified only on the cycles where its exact code appears.</p>`;
  wirePanel();
}
function wirePanel(){P.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{if(e.dataset.go==='city'){selected=null;selPrecinct=null;chipFilter=null;paint();animateTo(fit())}else{selPrecinct=null}renderPanel()});
  P.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>selectB(B[e.dataset.b],true));
  P.querySelectorAll('[data-chip]').forEach(e=>e.onclick=()=>{chipFilter=chipFilter===e.dataset.chip?null:e.dataset.chip;renderBrgy()});
  P.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{selPrecinct=selected.precincts.find(p=>p.code===e.dataset.p);renderPanel();P.scrollTop=0});
}
function selectB(b,zoom){selected=b;selPrecinct=null;chipFilter=null;paint();renderPanel();P.scrollTop=0;if(zoom&&b.bb)zoomTo(b.bb,2.2,170)}

// ---------- search ----------
const q=$('q'),qr=$('qres');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();if(!v){qr.hidden=true;return}const m=B.filter(b=>b.name.toLowerCase().includes(v)).slice(0,8);
  qr.innerHTML=m.length?m.map(b=>`<li><button data-b="${b.idx}">${b.name} <small style="color:var(--dim)">${b.district}</small></button></li>`).join(''):'<li style="padding:7px 10px;color:var(--dim)">No barangay by that name</li>';qr.hidden=false;
  qr.querySelectorAll('button').forEach(e=>e.onclick=()=>{selectB(B[e.dataset.b],true);q.value='';qr.hidden=true})});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){qr.querySelector('button')?.click()}if(e.key==='Escape'){q.value='';qr.hidden=true}});

addEventListener('resize',()=>{if(!selected)setView(fit());else drawLabels()});
renderModes();paint();renderPanel();
requestAnimationFrame(()=>requestAnimationFrame(()=>setView(fit())));
</script>
</body>
</html>
