<style>
:root{

  --mist:#8DA2C0;--dim:#5b6f8d;--paper:#E8EEF6;--signal:#35C0D0;--sea:#0a1830;--sea2:#0d1f3b;--none:#6B7A90;--warn:#E9C217;
  color-scheme:dark;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;

}
:root[data-theme="light"]{

  --mist:#4F6380;--dim:#7A8BA3;--paper:#0E1626;--signal:#0E8C9C;--sea:#DCE6F2;--sea2:#D2DEEC;--none:#9AA6B6;--warn:#8a6d00;
}
:root[data-theme="dark"]{
  --ink:#0B1220;--ink2:#0E1626;--panel:#121C2E;--panel2:#16223a;--line:#243450;--line2:#2f4364;
  --mist:#8DA2C0;--dim:#5b6f8d;--paper:#E8EEF6;--signal:#35C0D0;--sea:#0a1830;--sea2:#0d1f3b;--none:#6B7A90;--warn:#E9C217;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:12px 16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--ink2);flex-wrap:wrap}
.brand h1{font-family:var(--disp);font-weight:700;font-size:19px;margin:0;letter-spacing:.01em}
.brand p{margin:0;color:var(--mist);font-size:12px}
.real{font-family:var(--mono);font-size:11px;color:var(--signal);border:1px solid color-mix(in srgb,var(--signal) 55%,transparent);padding:3px 8px;border-radius:4px;white-space:nowrap}
.ctl{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--mist);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--paper);box-shadow:inset 0 -2px 0 var(--signal)}
.seg.area button{font-family:var(--disp);font-weight:600}
.trk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mist)}
.trk select{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;max-width:230px}
.trk .fixed{color:var(--paper);font-weight:500}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);min-height:0}
.mapwrap{position:relative;min-height:0;background:radial-gradient(120% 90% at 70% 80%,var(--sea2),var(--sea));overflow:hidden;border-right:1px solid var(--line)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.drag{cursor:grabbing}
.bg path{stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .2s,filter .2s;fill-rule:evenodd}
.bg path:hover{filter:brightness(1.18)}
.bg path.dim{fill-opacity:.12}
.sel{fill:none;stroke:var(--signal);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 6px var(--signal));fill-rule:evenodd}
.labels text{font-family:var(--disp);font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(8,14,26,.7);stroke-width:3px;text-anchor:middle;pointer-events:none;dominant-baseline:middle}
.lgulab text{font-family:var(--disp);font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(8,14,26,.8);text-anchor:middle;pointer-events:none;dominant-baseline:middle;letter-spacing:.04em;text-transform:uppercase}
.grat line{stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke;opacity:.5}
.ctx text{font-family:var(--body);font-style:italic;fill:var(--dim);pointer-events:none}
.tools{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:34px;height:34px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);cursor:pointer;font-size:16px;line-height:1}
.search{position:absolute;top:12px;right:12px;width:min(240px,50%)}
.search input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--paper);font:inherit}
.search ul{list-style:none;margin:4px 0 0;padding:0;background:var(--panel);border:1px solid var(--line2);border-radius:7px;max-height:220px;overflow:auto}
.search li button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;cursor:pointer}
.search li button:hover,.search li button:focus{background:var(--panel2)}
.legend{position:absolute;right:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;min-width:230px;max-width:290px}
.legend h3{margin:0 0 6px;font-family:var(--disp);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.legend h3 button{width:auto!important;margin-left:auto;padding:0 6px!important;font-size:14px;line-height:1.2;border:1px solid var(--line2)!important}
.legend.min{min-width:0;padding:8px 12px}.legend.min h3{margin:0}
.legend button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 2px;cursor:pointer;text-align:left;border-radius:4px;font-size:12.5px}
.legend button[aria-pressed="false"]{opacity:.35}
.legend .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mist)}
.legend small{display:block;color:var(--dim);font-size:11px;margin-top:6px}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10;display:none;min-width:170px}
.tip b{font-family:var(--disp);font-size:14px;display:block}
.tip .m{color:var(--mist)}
aside{overflow:auto;min-height:0;background:var(--panel);padding:18px 20px 28px}
.crumb{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mist);margin-bottom:10px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--signal);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h2{font-family:var(--disp);font-size:24px;line-height:1.15;margin:0 0 4px;font-weight:700}
.sub{color:var(--mist);margin:0 0 16px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-weight:600;font-size:12.5px;color:#fff}
.badge.lt{color:#1a1a1a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 20px}
.stats div{background:var(--panel2);padding:10px 12px}
.stats b{display:block;font-family:var(--disp);font-size:20px;font-weight:600}
.stats span{font-size:11.5px;color:var(--mist)}
section{margin-bottom:22px}
section>h3{font-family:var(--disp);font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
section>h3 small{font-family:var(--body);font-weight:400;color:var(--dim);font-size:12px}
.bar{margin-bottom:10px}
.bar .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mist);margin-bottom:4px}
.bar .t b{color:var(--paper);font-weight:500}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:10.5px;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack i.lt{color:#1a1a1a}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{display:flex;align-items:center;gap:8px;padding:9px 2px;cursor:pointer;list-style:none;font-weight:500}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;color:var(--mist);font-family:var(--mono);font-size:12px}
summary::after{content:"+";color:var(--dim);width:14px;text-align:center}
details[open] summary::after{content:"–"}
.alist{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:0 2px 10px}
.alist button{background:none;border:0;text-align:left;padding:4px 6px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;font-size:13px}
.alist button:hover{background:var(--panel2)}
.alist small{color:var(--dim);font-family:var(--mono);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-weight:500;color:var(--mist);padding:6px 6px;border-bottom:1px solid var(--line2)}
td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--panel2)}
.win{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{border-color:var(--signal)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.tiles button{border:0;border-radius:5px;padding:7px 4px;font-family:var(--mono);font-size:11px;color:#fff;cursor:pointer;text-align:center}
.tiles button.lt{color:#1a1a1a}
.tiles button:hover{outline:2px solid var(--paper);outline-offset:-2px}
.note{font-size:12px;color:var(--dim);border-left:2px solid var(--line2);padding-left:10px;margin-top:16px}
.note.warn{border-left-color:var(--warn);color:var(--mist)}
.back{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;margin-bottom:14px}
@media (max-width:900px){
  .app{height:auto}
  main{grid-template-columns:1fr}
  .mapwrap{height:68vh;border-right:0;border-bottom:1px solid var(--line)}
  .ctl{margin-left:0}
  .seg{overflow-x:auto;max-width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
  .legend{min-width:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const tip=$('tip');
bg.addEventListener('pointermove',e=>{const i=e.target.dataset?.i;if(i==null){tip.style.display='none';return}const u=U[i];
  const body=u.precs.length?`${clsLabel(u.k)}${u.cv.na?'':` · ${u.cv.m>=0?'+':''}${(Math.round(u.cv.m*10)/10)} pts`}`:'No result data in the scrape';
  tip.innerHTML=`<b>${u.name}</b>${A.lgus.length>1?`<span class="m">${LGU_LABEL[u.lgu]}</span><br>`:''}${body}<br><span class="m">${fmt(u.reg)} voters · ${u.precs.length} precincts</span>`;
  tip.style.display='block';const x=e.clientX+14,y=e.clientY+14;tip.style.left=Math.min(x,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(y,innerHeight-tip.offsetHeight-8)+'px'});
bg.addEventListener('pointerleave',()=>tip.style.display='none');
bg.addEventListener('click',e=>{if(moved)return;const i=e.target.dataset?.i;if(i!=null)selectU(U[i],true)});
bg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset?.i!=null){e.preventDefault();selectU(U[e.target.dataset.i],true)}});

function paint(){U.forEach(u=>{u.el.setAttribute('fill',HEX[u.k]);const h=hidden.has(u.k);u.el.style.fillOpacity=h?'':(selLgu&&u.lgu!==selLgu?.35:.95);u.el.classList.toggle('dim',h)});
  $('sel').setAttribute('d',selected?selected.d:'');renderLegend()}

// ---------- header ----------
function renderHeader(){
  $('blurb').textContent=A.blurb;
  const a=$('areasel');a.innerHTML='';Object.entries(AREAS).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.label;b.setAttribute('aria-pressed',k===areaKey);b.onclick=()=>{if(k===areaKey)return;setupArea(k);refresh();renderHeader();paint();renderPanel()};a.appendChild(b)});
  const r=$('racesel');r.innerHTML='';A.races.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.setAttribute('aria-pressed',x.id===raceId);b.onclick=()=>{raceId=x.id;selPrecinct=null;hidden.clear();chipFilter=null;refresh();renderHeader();paint();renderPanel()};r.appendChild(b)});
  const t=$('trk');t.innerHTML='';
  if(R.ticket){t.innerHTML=`<span class="fixed">${R.ticket.aName}</span> <span>vs</span> <span class="fixed">${R.ticket.bName}</span>`;return}
  const tallyAll=tallyOf(U.flatMap(u=>u.precs),R);const byC={};for(const [k,v] of Object.entries(tallyAll)){const ci=+k.split('|')[1];byC[ci]=(byC[ci]||0)+v}
  const opts=Object.entries(byC).sort((x,y)=>y[1]-x[1]).slice(0,12).map(([ci])=>['c:'+C[ci].n,`${pretty(C[ci].n)} (${C[ci].p})`]);
  if(A.lgus.length>1&&R.id==='MAYOR'){const parties=[...new Set(Object.keys(byC).map(ci=>C[ci].p))];const pv={};Object.entries(byC).forEach(([ci,v])=>pv[C[ci].p]=(pv[C[ci].p]||0)+v);opts.unshift(...parties.sort((a,b)=>pv[b]-pv[a]).slice(0,5).map(p=>['p:'+p,`Party: ${p} (all candidates)`]))}
  if(!opts.some(o=>o[0]===tok))opts.push([tok,tok.slice(2)]);
  const s=document.createElement('select');s.setAttribute('aria-label','Tracked candidate');
  opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===tok)o.selected=true;s.appendChild(o)});
  s.onchange=()=>{TRACK[areaKey+'|'+raceId]=s.value;selPrecinct=null;hidden.clear();chipFilter=null;refresh();paint();renderPanel()};
  t.appendChild(s);
}
function renderLegend(){const L=$('legend');const counts={};U.forEach(u=>counts[u.k]=(counts[u.k]||0)+1);
  L.classList.toggle('min',legMin);
  L.innerHTML=`<h3><span>${R.label}${R.ticket?'':' · '+trackName()}</span><button id="legtog" aria-label="${legMin?'Expand':'Collapse'} legend" aria-expanded="${!legMin}">${legMin?'+':'–'}</button></h3>`+(legMin?'':CLS.filter(k=>counts[k]||k!=='NA').map(k=>`<button data-k="${k}" aria-pressed="${!hidden.has(k)}" title="${clsRange[k]}"><span class="sw" style="background:${HEX[k]}"></span><span>${clsLabel(k)}</span><span class="n">${counts[k]||0}</span></button>`).join('')+`<small>2025 margin, in points. Click a class to isolate it. Hover a class for its range.</small>`);
  $('legtog').onclick=()=>{legMin=!legMin;renderLegend()};
  L.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const all=CLS;
    if(hidden.size===0)hidden=new Set(all.filter(x=>x!==k));else if(!hidden.has(k)&&hidden.size===all.length-1)hidden.clear();else hidden.has(k)?hidden.delete(k):hidden.add(k);paint()})}

// ---------- panel ----------
const P=$('panel');
const dot=c=>`<span class="win" style="background:${c}"></span>`;
function stackBar(title,items,unit){const tot=items.reduce((a,x)=>a+x.v,0)||1;return `<div class="bar"><div class="t"><span>${title}</span><b>${unit(tot)}</b></div><div class="stack">${items.map(x=>{const p=x.v/tot*100;return p>0?`<i style="width:${p}%;background:${x.c}" class="${x.c===HEX.BAT||x.c===HEX.A1||x.c===HEX.B1?'lt':''}" title="${x.l}: ${pct(p)}">${p>=7?Math.round(p)+'%':''}</i>`:''}).join('')}</div></div>`}
const splits=(units,val)=>CLS.map(k=>({l:clsLabel(k),c:HEX[k],v:units.filter(u=>u.k===k).reduce((a,u)=>a+val(u),0)}));
const badge=u=>`<span class="badge ${u.k==='BAT'||u.k==='A1'||u.k==='B1'?'lt':''}" style="background:${HEX[u.k]}">${clsLabel(u.k)}${u.cv.na?'':` · ${u.cv.m>=0?'+':''}${Math.round(u.cv.m*10)/10} pts`}</span>`;
function candRows(t,limit=7){
  const out=[];
  for(const pos of R.pos){
    const ent=Object.entries(t).filter(([k])=>k.startsWith(pos+'|')).map(([k,v])=>({ci:+k.split('|')[1],v})).sort((a,b)=>b.v-a.v);
    const tot=ent.reduce((a,x)=>a+x.v,0)||1;
    ent.slice(0,limit).forEach(x=>{const side=R.ticket?(R.ticket.A.some(([p,n])=>p===pos&&n===C[x.ci].n)?'A2':R.ticket.B.some(([p,n])=>p===pos&&n===C[x.ci].n)?'B2':'NA'):(matchTok(x.ci,tok)?'A2':'NA');
      out.push(`<tr><td>${dot(side==='A2'?HEX.A2:side==='B2'?HEX.B2:'var(--none)')}${pretty(C[x.ci].n)}${R.pos.length>1?` <small style="color:var(--dim)">${POS_LABEL[pos]}</small>`:''}</td><td class="l">${C[x.ci].p}</td><td>${fmt(x.v)}</td><td>${pct(x.v/tot*100)}</td></tr>`)});
    if(ent.length>limit){const rest=ent.slice(limit).reduce((a,x)=>a+x.v,0);out.push(`<tr><td>${dot('var(--none)')}${ent.length-limit} others</td><td class="l"></td><td>${fmt(rest)}</td><td>${pct(rest/tot*100)}</td></tr>`)}
  }
  return `<table><thead><tr><th>Candidate</th><th class="l">Party</th><th>Votes</th><th>Share</th></tr></thead><tbody>${out.join('')}</tbody></table>`;
}
function crumb(){const bits=[`<button data-go="area">${A.label}</button>`];
  if(selLgu)bits.push(selected||selPrecinct?`<button data-go="lgu">${LGU_LABEL[selLgu]}</button>`:`<span>${LGU_LABEL[selLgu]}</span>`);
  if(selected)bits.push(selPrecinct?`<button data-go="brgy">${selected.name}</button>`:`<span>${selected.name}</span>`);
  if(selPrecinct)bits.push(`<span>${selPrecinct.c}</span>`);
  return `<nav class="crumb" aria-label="Breadcrumb">${bits.join(' › ')}</nav>`}
function histBlock(){
  const rows=A.hist.flatMap(h=>HIST[h]||[]);
  if(!rows.length)return `<p class="note">No 2016 or 2019 winners on file for ${A.label} in the winners CSVs. Earlier cycles are city- or district-level only, so a Die Hard / Swing pattern needs precinct returns for 2016–2022 that this scrape doesn't have.</p>`;
  return `<section><h3>Earlier winners <small>city / district level only</small></h3><table><thead><tr><th>Year</th><th class="l">Office</th><th class="l">Winner</th><th>Votes</th></tr></thead><tbody>${rows.sort((a,b)=>a.y-b.y).map(r=>`<tr><td>${r.y}</td><td class="l">${pretty(r.pos.replace('MEMBER, HOUSE OF REPRESENTATIVES','House'))}</td><td class="l">${pretty(r.name)} <small style="color:var(--dim)">${r.party}</small></td><td>${fmt(r.votes)}</td></tr>`).join('')}</tbody></table></section>`}

function renderOverview(){
  const units=U.filter(u=>!selLgu||u.lgu===selLgu);
  const withData=units.filter(u=>u.precs.length);
  const allP=withData.flatMap(u=>u.precs);
  const reg=withData.reduce((a,u)=>a+u.reg,0),cast=withData.reduce((a,u)=>a+u.cast,0);
  const tAll=tallyOf(allP,R);
  const title=selLgu?LGU_LABEL[selLgu]:A.label;
  const rc=calc(tAll,R,tok);
  const sumLine=R.ticket?`Combined vote for ${R.ticket.aName} vs ${R.ticket.bName} across ${R.pos.map(p=>POS_LABEL[p]).join(', ')}.`:`Margin of ${trackName()} over the strongest rival in each barangay.`;
  const multi=!selLgu&&A.lgus.length>1;
  const muniRows=A.lgus.map(l=>{const us=U.filter(u=>u.lgu===l);const ps=us.flatMap(u=>u.precs);const t=tallyOf(ps,R);const c=calc(t,R,tok);
    const ent=Object.entries(t).map(([k,v])=>({ci:+k.split('|')[1],v})).sort((a,b)=>b.v-a.v);const tot=ent.reduce((a,x)=>a+x.v,0)||1;const w=ent[0];
    return `<tr class="go" data-lgu="${l}"><td>${dot(HEX[clsOf(c.m)])}${LGU_LABEL[l]}</td><td class="l">${w?pretty(C[w.ci].n)+' <small style="color:var(--dim)">'+C[w.ci].p+'</small>':'—'}</td><td>${w?pct(w.v/tot*100):'—'}</td><td>${c.na?'—':(c.m>=0?'+':'')+(Math.round(c.m*10)/10)}</td></tr>`}).join('');
  P.innerHTML=crumb()+`<h2>${title}</h2><p class="sub">${R.label} race, 2025. ${sumLine}</p>
  <div class="stats"><div><b>${withData.length}${withData.length<units.length?`<small style="font-size:12px;color:var(--mist)"> of ${units.length}</small>`:''}</b><span>barangays with results</span></div><div><b>${fmt(allP.length)}</b><span>precincts</span></div><div><b>${fmt(reg)}</b><span>registered voters</span></div><div><b>${reg?pct(cast/reg*100):'—'}</b><span>turnout</span></div></div>
  <section><h3>Share by class</h3>
   ${stackBar('Barangays',splits(units,u=>1),n=>fmt(n))}
   ${stackBar('Precincts',splits(units,u=>u.precs.length),n=>fmt(n))}
   ${stackBar('Registered voters',splits(units,u=>u.reg),n=>fmt(n))}
   ${stackBar('Land area',splits(units,u=>u.area),n=>Math.round(n)+' km²')}
  </section>
  ${multi?`<section><h3>By municipality <small>click to zoom</small></h3><table><thead><tr><th>Municipality</th><th class="l">Winner</th><th>Share</th><th>Margin</th></tr></thead><tbody>${muniRows}</tbody></table></section>`:''}
  ${(multi&&R.id==='MAYOR')?'':`<section><h3>Result <small>all precincts with data</small></h3>${candRows(tAll)}</section>`}
  <section><h3>Areas by class <small>sorted by voters</small></h3>
   ${CLS.map(k=>{const list=units.filter(u=>u.k===k).sort((a,b)=>b.reg-a.reg);if(!list.length)return'';return `<details${k==='BAT'||k==='NA'?' open':''}><summary>${dot(HEX[k])}${clsLabel(k)}<span class="n">${list.length}</span></summary><div class="alist">${list.map(u=>`<button data-b="${u.idx}">${u.name}<small>${u.precs.length?fmt(u.reg):'no data'}</small></button>`).join('')}</div></details>`}).join('')}
  </section>
  ${histBlock()}
  ${gapNote(units)}`;
  wirePanel();
}
function gapNote(units){
  const miss=units.filter(u=>!u.precs.length);const bits=[];
  if(miss.length)bits.push(`${miss.length} barangay polygons have no rows in the scrape (${miss.map(u=>u.name).join(', ')}) and show as “no result data”. They are probably barangays Comelec reports under another name or cluster, or ones the scraper skipped; their voters are not counted here.`);
  if(areaKey==='d6'||areaKey==='bacolod'){const np=U.flatMap(u=>u.precs).filter(p=>p.reg==null).length;if(np)bits.push(`${np} precinct has no voter-count row, so its voters and turnout are understated.`)}
  return `<p class="note${bits.length?' warn':''}">Real 2025 Comelec precinct returns (scraped), joined to barangays by exact name and to voter counts by exact precinct code. Margins are measured on 2025 only; classes replace Die Hard / Swing because no earlier precinct data exists for Negros Occidental. ${bits.join(' ')}</p>`}
function renderBrgy(){const u=selected;
  if(!u.precs.length){P.innerHTML=crumb()+`<button class="back" data-go="${selLgu?'lgu':'area'}">← Back</button><h2>${u.name}</h2><p class="sub"><span class="badge" style="background:${HEX.NA}">No result data</span></p><p class="note warn">The scraped Comelec file has no precinct rows for this barangay boundary.</p>`;wirePanel();return}
  const byK={};u.precs.forEach(p=>byK[p.k]=(byK[p.k]||0)+1);
  P.innerHTML=crumb()+`<button class="back" data-go="${selLgu?'lgu':'area'}">← ${selLgu?LGU_LABEL[selLgu]:A.label}</button><h2>${u.name}</h2><p class="sub">${A.lgus.length>1?LGU_LABEL[u.lgu]+' · ':''}${badge(u)}</p>
  <div class="stats"><div><b>${fmt(u.reg)}</b><span>registered voters</span></div><div><b>${u.precs.length}</b><span>precincts</span></div><div><b>${u.reg?pct(u.cast/u.reg*100):'—'}</b><span>turnout</span></div><div><b>${u.area<1?u.area.toFixed(2):u.area.toFixed(1)}</b><span>km²</span></div></div>
  <section><h3>Result <small>${R.label}, 2025</small></h3>${candRows(u.t)}</section>
  <section><h3>Precincts <small>by class</small></h3>
   <div class="chips">${CLS.filter(k=>byK[k]).map(k=>`<button data-chip="${k}" aria-pressed="${chipFilter===k}">${dot(HEX[k])}${clsLabel(k)} ${byK[k]}</button>`).join('')}</div>
   <div class="tiles">${u.precs.filter(p=>!chipFilter||p.k===chipFilter).map(p=>`<button data-p="${p.c}" class="${p.k==='BAT'||p.k==='A1'||p.k==='B1'?'lt':''}" style="background:${HEX[p.k]}" title="${p.c} · ${p.cv.na?'no data':(p.cv.m>=0?'+':'')+(Math.round(p.cv.m*10)/10)+' pts'}">${p.c.slice(-4)}</button>`).join('')}</div>
  </section>`;
  wirePanel();
}
function renderPrecinct(){const p=selPrecinct;
  P.innerHTML=crumb()+`<button class="back" data-go="brgy">← ${selected.name}</button><h2>Precinct ${p.c}</h2><p class="sub">${selected.name} · <span class="badge ${p.k==='BAT'||p.k==='A1'||p.k==='B1'?'lt':''}" style="background:${HEX[p.k]}">${clsLabel(p.k)}${p.cv.na?'':` · ${p.cv.m>=0?'+':''}${Math.round(p.cv.m*10)/10} pts`}</span></p>
  <div class="stats"><div><b>${p.reg==null?'—':fmt(p.reg)}</b><span>registered voters</span></div><div><b>${p.cast==null?'—':fmt(p.cast)}</b><span>voted</span></div><div><b>${p.reg?pct(p.cast/p.reg*100):'—'}</b><span>turnout</span></div><div><b>${fmt(p.cv.total)}</b><span>votes in race</span></div></div>
  <section><h3>Result <small>${R.label}, 2025</small></h3>${candRows(p.t)}</section>
  <p class="note">Clustered precinct code ${p.c}. Exact-code join between the results and voter-count files.</p>`;
  wirePanel();
}
function renderPanel(){if(selPrecinct)return renderPrecinct();if(selected)return renderBrgy();renderOverview()}
function wirePanel(){
  P.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{const g=e.dataset.go;
    if(g==='area'){selLgu=null;selected=null;selPrecinct=null;chipFilter=null;paint();animateTo(fit())}
    else if(g==='lgu'){selected=null;selPrecinct=null;chipFilter=null;paint();const c=A.lguC.find(c=>c.lgu===selLgu);if(c&&c.bb)zoomTo(c.bb,1.25)}
    else selPrecinct=null;
    renderPanel()});
  P.querySelectorAll('[data-lgu]').forEach(e=>e.onclick=()=>{selLgu=e.dataset.lgu;selected=null;selPrecinct=null;paint();renderPanel();const c=A.lguC.find(c=>c.lgu===selLgu);if(c&&c.bb)zoomTo(c.bb,1.25);P.scrollTop=0});
  P.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>selectU(U[e.dataset.b],true));
  P.querySelectorAll('[data-chip]').forEach(e=>e.onclick=()=>{chipFilter=chipFilter===e.dataset.chip?null:e.dataset.chip;renderBrgy()});
  P.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{selPrecinct=selected.precs.find(p=>p.c===e.dataset.p);renderPanel();P.scrollTop=0});
}
function selectU(u,zoom){selected=u;selPrecinct=null;chipFilter=null;if(A.lgus.length>1)selLgu=u.lgu;paint();renderPanel();P.scrollTop=0;if(zoom&&u.bb)zoomTo(u.bb,2.2,50)}

// ---------- search ----------
const q=$('q'),qr=$('qres');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();if(!v){qr.hidden=true;return}const m=U.filter(u=>u.name.toLowerCase().includes(v)).slice(0,8);
  qr.innerHTML=m.length?m.map(u=>`<li><button data-b="${u.idx}">${u.name}${A.lgus.length>1?` <small style="color:var(--dim)">${LGU_LABEL[u.lgu]}</small>`:''}</button></li>`).join(''):'<li style="padding:7px 10px;color:var(--dim)">No barangay by that name</li>';qr.hidden=false;
  qr.querySelectorAll('button').forEach(e=>e.onclick=()=>{selectU(U[e.dataset.b],true);q.value='';qr.hidden=true})});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){qr.querySelector('button')?.click()}if(e.key==='Escape'){q.value='';qr.hidden=true}});

addEventListener('resize',()=>{if(!selected&&!selLgu)setView(fit());else drawLabels()});
const qs=new URLSearchParams(location.search);
setupArea(AREAS[qs.get('area')]?qs.get('area'):'bacolod');refresh();renderHeader();paint();renderPanel();
</script>

</body></html>
